<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>Reaktionsspiel</title>
    <style>
        body {
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #222;
            color: white;
            user-select: none;
        }

        #gameArea {
            width: 300px;
            height: 300px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .area{
            display: flex;
            justify-content: center;
            margin: 100px;
        }
        h1{
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h1> Reaction Game </h1>
    <div class="area">
        <div id="gameArea">Press to Start</div>
    </div>

    <script>
        const gameArea = document.getElementById("gameArea");
        let startTime, timeoutID;
        let waiting = false;

        gameArea.addEventListener("click", () => {
            if (!waiting) {
                gameArea.textContent = "Wait until it's green...";
                gameArea.style.backgroundColor = "red";
                waiting = true;

                const randomDelay = Math.random() * 3000 + 2000;
                timeoutID = setTimeout(() => {
                    gameArea.style.backgroundColor = 'green';
                    gameArea.textContent = "PRESS";
                    startTime = Date.now();
                }, randomDelay);
            } else {
                if (gameArea.style.backgroundColor === 'green') {
                    const reactionTime = Date.now() - startTime;
                    gameArea.style.whiteSpace = "pre-line";
                    gameArea.textContent = `Reaction Time: ${reactionTime} ms \n \n Press to Restart`;
                    gameArea.style.backgroundColor = '#444';
                    waiting = false;
                } else {
                    clearTimeout(timeoutID);
                    gameArea.textContent = 'Too early! Press to Restart';
                    gameArea.style.backgroundColor = '#444';
                    waiting = false;
                }
            }
        });
    </script>

</body>

</html>
